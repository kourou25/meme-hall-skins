name: 装扮投稿检查
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: 检查作品与预览文件
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取投稿代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 获取可信检查程序
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-check
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装可信解析依赖
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then npm ci --prefix .trusted-check; else npm ci; fi
      - name: 运行检查
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SUBMISSION_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node --test .trusted-check/tests/*.test.mjs
            node .trusted-check/scripts/validate-snapshot.mjs "$GITHUB_WORKSPACE" "$BASE_SHA" HEAD
          elif [ "$EVENT_NAME" = "push" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node --test tests/*.test.mjs
            node scripts/validate-snapshot.mjs "$GITHUB_WORKSPACE" "$BASE_SHA" HEAD --trusted
          else
            node --test tests/*.test.mjs
            echo '手动检查：基础测试完成。'
          fi
      - name: 显示当前接入状态
        if: always()
        shell: bash
        run: |
          echo '## 装扮投稿状态' >> "$GITHUB_STEP_SUMMARY"
          echo '投稿支持图片和限定作用范围的 CSS。网站显示以发布确认状态为准。' >> "$GITHUB_STEP_SUMMARY"
          echo '如检查失败，请查看上方步骤错误。' >> "$GITHUB_STEP_SUMMARY"
